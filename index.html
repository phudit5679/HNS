                }

                return { availableMonths, depts, availableRegions, availableStoresForDropdown, filteredStores, totalStores, auditedCount, pendingCount, avgScore };
            }, [auditHistory, storeDataList, filterMonth, filterDept, filterRegion, filterSearch, filterScore, filterStatus]);

            const indexOfLastItem = currentPage * itemsPerPage;
            const indexOfFirstItem = indexOfLastItem - itemsPerPage;
            const currentStores = dashboardData.filteredStores.slice(indexOfFirstItem, indexOfLastItem);
            const totalPages = Math.ceil(dashboardData.filteredStores.length / itemsPerPage);

            const paginate = (pageNumber) => setCurrentPage(pageNumber);

            const monthlyChartData = React.useMemo(() => {
                let relevantHistory = auditHistory;
                // กรองข้อมูลตามฟิลเตอร์เหมือนเดิม
                if (filterDept || filterRegion || filterSearch) {
                    relevantHistory = auditHistory.filter(record => {
                        const s = storeDataList.find(store => store.code === record.storeInfo?.code) || record.storeInfo;
                        const matchDept = filterDept === '' || s?.department === filterDept;
                        const matchRegion = filterRegion === '' || s?.zone === filterRegion;
                        const matchSearch = filterSearch === '' || s?.code === filterSearch;
                        return matchDept && matchRegion && matchSearch;
                    });
                }

                const grouped = {};

                // ขั้นตอนที่เพิ่มมา: จัดกลุ่มตามเดือน และเก็บเฉพาะข้อมูล "ล่าสุด" ของแต่ละสาขาในเดือนนั้นๆ
                const storeLatestInMonth = {};

                relevantHistory.forEach(record => {
                    let recMonth = record.month;
                    if(!recMonth && record.storeInfo?.date) {
                        const parts = record.storeInfo.date.split('-');
                        if(parts.length >= 2) recMonth = `${parts[0]}-${parts[1]}`;
                    }
                    if (!recMonth) return;

                    const code = record.storeInfo?.code;
                    if (!code) return;

                    const key = `${recMonth}_${code}`;
                    // ถ้ายังไม่มีข้อมูลสาขานี้ในเดือนนี้ หรือ ข้อมูลที่มีอยู่เก่ากว่าข้อมูลปัจจุบัน ให้เอาข้อมูลใหม่ใส่แทน
                    if (!storeLatestInMonth[key] || new Date(record.createdAt) > new Date(storeLatestInMonth[key].createdAt)) {
                        storeLatestInMonth[key] = record;
                    }
                });

                // นำเฉพาะใบประเมินล่าสุดของแต่ละสาขาในแต่ละเดือนมาคำนวณค่าเฉลี่ย
                Object.values(storeLatestInMonth).forEach(record => {
                    let recMonth = record.month;
                    if(!recMonth && record.storeInfo?.date) {
                        const parts = record.storeInfo.date.split('-');
                        if(parts.length >= 2) recMonth = `${parts[0]}-${parts[1]}`;
                    }
                   if (!grouped[recMonth]) grouped[recMonth] = { sum: 0, count: 0 };
                    grouped[recMonth].sum += parseFloat(record.totalPercentage) || 0;
                    grouped[recMonth].count += 1;
                });

                const sortedMonths = Object.keys(grouped).sort();
                const last6Months = sortedMonths.slice(-6);

                return last6Months.map(m => {
                    const fullThaiDate = formatMonthYear(m);
                    const parts = fullThaiDate.split(' ');
                    const shortLabel = parts.length === 2 ? `${parts[0]} ${parts[1].substring(2)}` : fullThaiDate;
                    return { monthStr: m, label: shortLabel, avg: (grouped[m].sum / grouped[m].count).toFixed(2) }; // เปลี่ยนทศนิยมเป็น 2 ตำแหน่งให้เหมือนการ์ด
                });
            }, [auditHistory, storeDataList, filterDept, filterRegion, filterSearch]);

            const clearFilters = () => { setFilterMonth(currentYYYY_MM); setFilterDept(''); setFilterRegion(''); setFilterSearch(''); setFilterScore(''); setFilterStatus(''); setFilterGrade(''); };

            const analysisData = React.useMemo(() => {
                const storeAudits = {};
                auditHistory.forEach(record => {
                   const code = record.storeInfo?.code;
                    if (!code) return;
                    if (!storeAudits[code]) storeAudits[code] = [];
                    storeAudits[code].push(record);
                });

                const repeatedIssues = [];
                const storeImprovements = [];
                const deptStats = {};
                const deptAvgCalc = {};
                const zoneAvgCalc = {};

                const criticalIds = ['1.10', '1.11', '3.21', '5.3']; // รายการข้อบกพร่องร้ายแรง
                const criticalAlerts = [];
                const topIssuesCount = {};
                let gradeDist = {
                    excellent: { count: 0, stores: [] },
                    warning: { count: 0, stores: [] },
                    poor: { count: 0, stores: [] }
                };
                const storeMoM = []; // เก็บการเปลี่ยนแปลง MoM

                // Helper สำหรับแปะป้ายชื่อหมวด
                const getContextTag = (itemId) => {
                    if (['1.1.1', '1.1.2', '1.1.3'].includes(itemId)) return '☕ Amazon Blend - Double Shot';
                    if (['1.1.4', '1.1.5', '1.1.6'].includes(itemId)) return '☕ Amazon Blend - Single Shot';
                    if (['1.1.7', '1.1.8', '1.1.9'].includes(itemId)) return '⭐ Selected Blend - Double Shot';
                    if (['1.1.10', '1.1.11', '1.1.12'].includes(itemId)) return '⭐ Selected Blend - Single Shot';

                    const prefix = itemId.split('.')[0];
                    if (prefix === '1') return 'ส่วนที่ 1 : มาตรฐานคุณภาพ';
                    if (prefix === '2') return 'ส่วนที่ 2 : พนักงานและบริการ';
                    if (prefix === '3') return 'ส่วนที่ 3 : ความสะอาด';
                    if (prefix === '4') return 'ส่วนที่ 4 : งานด้านเอกสาร';
                    if (prefix === '5') return 'ส่วนที่ 5 : กฎหมายที่เกี่ยวข้อง';
                    return '';
                };

                Object.entries(storeAudits).forEach(([code, records]) => {
                    const sortedRecords = [...records].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    if (sortedRecords.length === 0) return;

                    // จัดกลุ่มตามเดือนที่ประเมิน (ดึงใบเสร็จล่าสุดของแต่ละเดือน)
                    const recordsByMonth = {};
                    sortedRecords.forEach(rec => {
                        let m = rec.month;
                        if (!m && rec.storeInfo?.date) {
                            const parts = rec.storeInfo.date.split('-');
                            if (parts.length >= 2) m = `${parts[0]}-${parts[1]}`;
                        }
                        if (m && !recordsByMonth[m]) {
                            recordsByMonth[m] = rec;
                        }
                    });

                    // ดึงรายการเดือนที่มีการประเมินออกมาเรียง (จากใหม่ไปเก่า)
                    const distinctMonths = Object.keys(recordsByMonth).sort().reverse();

                    const latest = sortedRecords[0];
                    const storeMeta = storeDataList.find(s => s.code === code) || {};
                    const dept = latest.storeInfo?.department || storeMeta.department || 'ไม่ระบุฝ่าย';
                    const zone = latest.storeInfo?.zone || storeMeta.zone || 'ไม่ระบุเขต';

                    // Apply Filters
                    if (filterDept && dept !== filterDept) return;
                    if (filterRegion && zone !== filterRegion) return;
                    if (filterSearch && code !== filterSearch) return;
                    if (filterMonth) {
                        let recMonth = latest.month;
                        if (!recMonth && latest.storeInfo?.date) {
                            const parts = latest.storeInfo.date.split('-');
                            if (parts.length >= 2) recMonth = `${parts[0]}-${parts[1]}`;
                        }
                        if (recMonth !== filterMonth) return;
                    }

                    const lPct = parseFloat(latest.totalPercentage) || 0;
                    if (filterGrade) {
                        if (filterGrade === 'excellent' && lPct < 95) return;
                        if (filterGrade === 'warning' && (lPct >= 95 || lPct < 90)) return;
                        if (filterGrade === 'poor' && lPct >= 90) return;
                    }

                    // คำนวณค่าเฉลี่ยรายฝ่ายและรายเขต
                    if (!deptAvgCalc[dept]) deptAvgCalc[dept] = { sum: 0, count: 0 };
                    deptAvgCalc[dept].sum += lPct;
                    deptAvgCalc[dept].count += 1;

                    if (!zoneAvgCalc[zone]) zoneAvgCalc[zone] = { sum: 0, count: 0 };
                    zoneAvgCalc[zone].sum += lPct;
                    zoneAvgCalc[zone].count += 1;

                    // คำนวณสัดส่วนเกรด (Grade Distribution)
                    if (lPct >= 95) {
                        gradeDist.excellent.count++;
                        gradeDist.excellent.stores.push({ code, name: latest.storeInfo?.name || storeMeta.name || 'ไม่ทราบชื่อ', pct: lPct, dept, zone });
                    }
                    else if (lPct >= 90) {
                        gradeDist.warning.count++;
                        gradeDist.warning.stores.push({ code, name: latest.storeInfo?.name || storeMeta.name || 'ไม่ทราบชื่อ', pct: lPct, dept, zone });
                    }
                    else {
                        gradeDist.poor.count++;
                        gradeDist.poor.stores.push({ code, name: latest.storeInfo?.name || storeMeta.name || 'ไม่ทราบชื่อ', pct: lPct, dept, zone });
                    }

                    // การพัฒนาเทียบกับเดือนก่อน (MoM Growth & Decline)
                    if (distinctMonths.length >= 2) {
                        const pPct = parseFloat(recordsByMonth[distinctMonths[1]].totalPercentage) || 0;
                        const diff = (lPct - pPct).toFixed(2);
                        storeMoM.push({
                            code, name: latest.storeInfo?.name || storeMeta.name || 'ไม่ทราบชื่อ',
                            dept, zone, lPct, pPct, diff: parseFloat(diff)
                        });
                    }

                    // เงื่อนไข: ตรวจปัญหาซ้ำซาก ต้องมีการประเมินอย่างน้อย 2 เดือนที่ต่างกัน
                    if (distinctMonths.length >= 2) {
                        const latestMonthRecord = recordsByMonth[distinctMonths[0]];
                        const prevMonthRecord = recordsByMonth[distinctMonths[1]];
                        const repeatedItems = [];

                        checklistSections.forEach(sec => {
                            sec.items.forEach(item => {
                                if (item.isHeader || item.alwaysShow) return;

                                const lType = latestMonthRecord.storeInfo?.storeType || 'out';
                                const pType = prevMonthRecord.storeInfo?.storeType || 'out';
                                if (item.onlyFor && (item.onlyFor !== lType || item.onlyFor !== pType)) return;

                                const itemMax = lType === 'in' ? (item.maxIn || 0) : (item.maxOut || 0);
                                if (itemMax === 0) return;

                                const latestScore = latestMonthRecord.scores?.[item.id];
                                const prevScore = prevMonthRecord.scores?.[item.id];

                                if (latestScore === 0 && prevScore === 0) {
                                    repeatedItems.push({
                                        id: item.id,
                                        tag: getContextTag(item.id), // <- ใส่ Tag ตรงนี้
                                        desc: `${item.id} ${item.desc.replace(/\n/g, ' ')}`,
                                        latestRemark: latestMonthRecord.remarks?.[item.id] || '',
                                        prevRemark: prevMonthRecord.remarks?.[item.id] || ''
                                    });
                                }
                            });
                        });

                        if (repeatedItems.length > 0) {
                            repeatedIssues.push({
                                code, name: latestMonthRecord.storeInfo?.name || storeMeta.name || 'ไม่ทราบชื่อ',
                                dept, zone, latestDate: latestMonthRecord.storeInfo?.date, prevDate: prevMonthRecord.storeInfo?.date,
                                items: repeatedItems
                            });
                        }
                    }

                    // ====== วิเคราะห์จุดควรปรับปรุง, ข้อบกพร่องยอดฮิต, และแจ้งเตือนร้ายแรง ======
                    const latestRecordForImprovement = distinctMonths.length > 0 ? recordsByMonth[distinctMonths[0]] : latest;
                    const improvements = [];
                    const criticalsFound = [];
                    const lType = latestRecordForImprovement.storeInfo?.storeType || 'out';

                    checklistSections.forEach(sec => {
                        sec.items.forEach(item => {
                            if (item.isHeader || item.alwaysShow) return;
                            if (item.onlyFor && item.onlyFor !== lType) return;

                            const itemMax = lType === 'in' ? (item.maxIn || 0) : (item.maxOut || 0);
                            if (itemMax > 0) {
                                const score = latestRecordForImprovement.scores?.[item.id];
                                if (score !== undefined && score < itemMax) {
                                    const fullDesc = `${item.id} ${item.desc.replace(/\n/g, ' ')}`;
                                    const tag = getContextTag(item.id); // <- ดึง Tag ออกมา

                                    improvements.push({
                                        id: item.id, desc: fullDesc, tag: tag,
                                        score: score, max: itemMax,
                                        remark: latestRecordForImprovement.remarks?.[item.id] || ''
                                    });

                                    // เก็บสถิติ Top 5 Issues
                                    if (!topIssuesCount[item.id]) {
                                        topIssuesCount[item.id] = { id: item.id, desc: fullDesc, tag: tag, count: 0, branches: [] };
                                    }
                                    topIssuesCount[item.id].count++;

                                    const branchName = latestRecordForImprovement.storeInfo?.name || storeMeta.name || 'ไม่ทราบชื่อ';
                                    const isExist = topIssuesCount[item.id].branches.find(b => b.storeName === branchName);
                                    if (!isExist) {
                                        topIssuesCount[item.id].branches.push({
                                            storeName: branchName,
                                            dept: dept,
                                            zone: zone
                                        });
                                    }

                                    // ตรวจจับข้อบกพร่องร้ายแรง
                                    if (criticalIds.includes(item.id)) {
                                        criticalsFound.push({
                                            id: item.id, desc: fullDesc, tag: tag,
                                            remark: latestRecordForImprovement.remarks?.[item.id] || ''
                                        });
                                    }
                                }
                            }
                        });
                    });

                    if (improvements.length > 0) {
                        storeImprovements.push({
                            code, name: latestRecordForImprovement.storeInfo?.name || storeMeta.name || 'ไม่ทราบชื่อ',
                            dept, zone, date: latestRecordForImprovement.storeInfo?.date,
                            percentage: latestRecordForImprovement.totalPercentage, improvements
                        });
                    }

                    if (criticalsFound.length > 0) {
                        criticalAlerts.push({
                            code, name: latestRecordForImprovement.storeInfo?.name || storeMeta.name || 'ไม่ทราบชื่อ',
                            dept, zone, date: latestRecordForImprovement.storeInfo?.date, issues: criticalsFound
                        });
                    }
                    // =======================================================

                    if (!deptStats[dept]) deptStats[dept] = { zones: {}, totals: {} };
                    if (!deptStats[dept].zones[zone]) deptStats[dept].zones[zone] = { totals: {} };

                    checklistSections.forEach(sec => {
                        if (!deptStats[dept].totals[sec.id]) deptStats[dept].totals[sec.id] = { actual: 0, max: 0 };
                        if (!deptStats[dept].zones[zone].totals[sec.id]) deptStats[dept].zones[zone].totals[sec.id] = { actual: 0, max: 0 };

                        const type = latest.storeInfo?.storeType || 'out';
                        let secActual = 0;
                        let secMax = 0;

                        sec.items.forEach(item => {
                            if (item.isHeader || item.alwaysShow) return;
                            if (item.onlyFor && item.onlyFor !== type) return;

                            const itemMax = type === 'in' ? (item.maxIn || 0) : (item.maxOut || 0);
                            if (itemMax > 0) {
                                secMax += itemMax;
                                secActual += (latest.scores?.[item.id] || 0);
                            }
                        });

                        deptStats[dept].totals[sec.id].actual += secActual;
                        deptStats[dept].totals[sec.id].max += secMax;
                        deptStats[dept].zones[zone].totals[sec.id].actual += secActual;
                        deptStats[dept].zones[zone].totals[sec.id].max += secMax;
                    });
                });

                repeatedIssues.sort((a, b) => {
                    if (a.dept !== b.dept) return a.dept.localeCompare(b.dept);
                    if (a.zone !== b.zone) return a.zone.localeCompare(b.zone);
                    return b.items.length - a.items.length;
                });

                storeImprovements.sort((a, b) => {
                    if (a.dept !== b.dept) return a.dept.localeCompare(b.dept);
                    if (a.zone !== b.zone) return a.zone.localeCompare(b.zone);
                    return b.improvements.length - a.improvements.length; // เรียงสาขาที่ผิดเยอะขึ้นก่อน
                });

                const heatmapData = [];
                Object.keys(deptStats).sort().forEach(dept => {
                    const dData = deptStats[dept];
                   heatmapData.push({ type: 'dept', name: dept, scores: dData.totals });
                    Object.keys(dData.zones).sort().forEach(zone => {
                        heatmapData.push({ type: 'zone', name: zone, dept: dept, scores: dData.zones[zone].totals });
                    });
                });

                const deptAverages = Object.keys(deptAvgCalc).map(k => ({
                    name: k, avg: (deptAvgCalc[k].sum / deptAvgCalc[k].count).toFixed(2), count: deptAvgCalc[k].count
                })).sort((a, b) => parseFloat(b.avg) - parseFloat(a.avg));

                const zoneAverages = Object.keys(zoneAvgCalc).map(k => ({
                    name: k, avg: (zoneAvgCalc[k].sum / zoneAvgCalc[k].count).toFixed(2), count: zoneAvgCalc[k].count
                })).sort((a, b) => parseFloat(b.avg) - parseFloat(a.avg));

                const top5CommonIssues = Object.values(topIssuesCount).sort((a, b) => b.count - a.count).slice(0, 5);
                const topImproved = [...storeMoM].filter(s => s.diff > 0).sort((a, b) => b.diff - a.diff).slice(0, 5);
                const topDeclined = [...storeMoM].filter(s => s.diff < 0).sort((a, b) => a.diff - b.diff).slice(0, 5);

                gradeDist.excellent.stores.sort((a, b) => b.pct - a.pct);
                gradeDist.warning.stores.sort((a, b) => b.pct - a.pct);
                gradeDist.poor.stores.sort((a, b) => a.pct - b.pct);

                return {
                    repeatedIssues, heatmapData, storeImprovements, deptAverages, zoneAverages,
                    criticalAlerts, top5CommonIssues, gradeDist, topImproved, topDeclined
                };
            }, [auditHistory, storeDataList, filterMonth, filterDept, filterRegion, filterSearch, filterGrade]);

            const startAuditForStore = (store) => {
                const now = new Date();
                setStoreInfo({
                    code: store.code, name: store.name, province: store.province, department: store.department, zone: store.zone,
                    auditor: storeInfo.auditor || store.auditor,
                    date: `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`,
                    time: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
                    storeType: 'out', latitude: '', longitude: '', mapLink: ''
                });
                setScores({}); setRemarks({}); setMeasurements({}); setImages({}); setCheckedItems({});
                setSignatures({ manager: null, auditor: null }); setViewingRecord(null); setEditingId(null);
                setFormKey(k => k + 1);
                setAuditStartTime(Date.now()); setCurrentView('form'); window.scrollTo(0, 0);
            };

            const renderDashboard = () => {
                return (
                    <div className="w-full max-w-7xl mx-auto p-4 py-8">
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-xl font-extrabold text-gray-800">สรุปผลการตรวจสอบ</h2>
                                <button onClick={() => loadAuditHistory(true)} disabled={isLoadingHistory} className="flex items-center gap-1.5 text-sm bg-blue-50 text-blue-700 px-3.5 py-2 rounded-lg border border-blue-200 hover:bg-blue-100 transition shadow-sm font-bold disabled:opacity-50 disabled:cursor-not-allowed">
                                    <svg className={`w-4 h-4 ${isLoadingHistory ? 'animate-spin' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                    {isLoadingHistory ? 'กำลังโหลด...' : 'รีเฟรชข้อมูล'}
                                </button>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                                <div className="bg-gray-50 border border-gray-200 p-4 rounded-xl flex items-center justify-between shadow-sm">
                                    <div><p className="text-sm text-gray-600 font-bold">จำนวนสาขาทั้งหมด</p><p className="text-3xl font-black text-gray-800">{dashboardData.totalStores}</p></div>
                                    <div className="text-gray-300"><svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg></div>
                                </div>
                                <div className="bg-green-50 border border-green-200 p-4 rounded-xl flex items-center justify-between shadow-sm">
                                    <div><p className="text-sm text-green-700 font-bold">เข้าตรวจแล้ว</p><p className="text-3xl font-black text-green-700">{dashboardData.auditedCount}</p></div>
                                    <div className="text-green-300"><svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                                </div>
                                <div className="bg-red-50 border border-red-200 p-4 rounded-xl flex items-center justify-between shadow-sm">
                                    <div><p className="text-sm text-red-600 font-bold">ยังไม่ได้เข้าตรวจ</p><p className="text-3xl font-black text-red-600">{dashboardData.pendingCount}</p></div>
                                    <div className="text-red-300"><svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                                </div>
                                <div className="bg-blue-50 border border-blue-200 p-4 rounded-xl flex items-center justify-between shadow-sm">
                                    <div><p className="text-sm text-blue-700 font-bold">ค่าเฉลี่ยคะแนน</p><p className="text-3xl font-black text-blue-700">{dashboardData.avgScore > 0 ? `${dashboardData.avgScore}%` : '-'}</p></div>
                                    <div className="text-blue-300"><svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg></div>
                                </div>

                                                                : 'text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50'
                                                            }`}
                                                        >
                                                            {pageNum}
                                                        </button>
                                                    );
                                                })}

                                                <button
                                                    onClick={() => paginate(currentPage + 1)}
                                                    disabled={currentPage === totalPages}
                                                    className="relative inline-flex items-center rounded-r-md px-2 py-2 text-gray-400 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0 disabled:opacity-50 disabled:cursor-not-allowed"
                                                >
                                                    <span className="sr-only">Next</span>
                                                    <svg className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fillRule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clipRule="evenodd" /></svg>
                                                </button>
                                            </nav>
                                        </div>
                                    </div>
                                    <div className="flex flex-1 justify-between sm:hidden">
                                        <button
                                            onClick={() => paginate(currentPage - 1)}
                                            disabled={currentPage === 1}
                                            className="relative inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50"

                                            ก่อนหน้า
                                        </button>
                                        <span className="text-sm text-gray-700 self-center">หน้า {currentPage} / {totalPages}</span>
                                        <button
                                            onClick={() => paginate(currentPage + 1)}
                                            disabled={currentPage === totalPages}
                                            className="relative inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50"
                                        >
                                            ถัดไป
                                        </button>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                );
            };

            const renderAnalysis = () => {
                const getHeatmapColor = (percentage) => {
                    if (percentage === null || isNaN(percentage)) return 'bg-gray-100 text-gray-400';
                    if (percentage >= 95) return 'bg-green-100 text-green-800 font-bold';
                    if (percentage >= 90) return 'bg-yellow-100 text-yellow-800 font-bold';
                    return 'bg-red-100 text-red-800 font-black';

                                <div className="flex-1 col-span-2 md:col-span-1">

                                    <select value={filterMonth} onChange={e => setFilterMonth(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:border-yellow-400 focus:outline-none bg-white shadow-sm font-bold text-blue-700">
                                        <option value="">ทั้งหมด ทุกช่วงเวลา (ล่าสุด)</option>
                                        {(!dashboardData.availableMonths.includes(currentYYYY_MM) && filterMonth === currentYYYY_MM) && <option value={currentYYYY_MM}>{formatMonthYear(currentYYYY_MM)}</option>}
                                        {dashboardData.availableMonths.map(m => <option key={m} value={m}>{formatMonthYear(m)}</option>)}
                                    </select>
                                </div>
                                <div className="flex-1">

                                        <option value="">ทั้งหมด</option>
                                        {dashboardData.depts.map(d => <option key={d} value={d}>{d}</option>)}
                                    </select>
                                </div>
                                <div className="flex-1">
                                    <label className="block text-xs font-bold text-gray-500 mb-1">3. เขต</label>
                                    <select value={filterRegion} onChange={e => { setFilterRegion(e.target.value); setFilterSearch(''); }} className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:border-yellow-400 focus:outline-none bg-white shadow-sm">
                                        <option value="">ทั้งหมด</option>
                                        {dashboardData.availableRegions.map(r => <option key={r} value={r}>{r}</option>)}
                                    </select>
                                </div>
                                <div className="flex-1 col-span-2 md:col-span-1">
                                    <label className="block text-xs font-bold text-gray-500 mb-1">4. สาขา</label>
                                    <SearchableSelect
                                        value={filterSearch}
                                        onChange={(val) => setFilterSearch(val)}

                                        placeholder="พิมพ์รหัสหรือชื่อสาขา..."
                                    />
                                </div>
                                <div className="flex-1 col-span-2 md:col-span-1">
                                    <label className="block text-xs font-bold text-gray-500 mb-1">5. เกรดประเมิน</label>

                                        <option value="">ทั้งหมด</option>
                                        <option value="excellent" className="text-green-700">ดีเยี่ยม (≥ 95%)</option>
                                        <option value="warning" className="text-yellow-600">เฝ้าระวัง (90-94%)</option>
                                        <option value="poor" className="text-red-600">ปรับปรุง (&lt; 90%)</option>
                                    </select>

                        {/* กราฟแท่งแนวนอน สรุปฝ่าย และ เขต */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-5">
                                <div className="flex items-center gap-3 mb-3 border-b border-gray-100 pb-2.5">
                                    <div className="bg-indigo-100 p-1.5 rounded-lg">
                                        <svg className="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    </div>

                                    {analysisData.deptAverages.length === 0 ? (
                                        <p className="text-center text-gray-400 text-xs py-4">ไม่มีข้อมูล</p>
                                    ) : (
                                        analysisData.deptAverages.map((item, idx) => (
                                            <div key={idx} className="flex items-center text-xs">
                                                <div className="w-14 md:w-16 truncate font-bold text-gray-600" title={item.name}>{item.name}</div>

                                            </div>

                            {totalDistCount === 0 ? (
                                <div className="flex-1 flex items-center justify-center text-gray-400 text-sm py-4">ไม่มีข้อมูล</div>

                                <div className="flex-1 flex flex-col justify-center gap-5">
                                    <div className="h-6 w-full flex rounded-full overflow-hidden shadow-inner bg-gray-100">
                                        <div style={{width: `${(analysisData.gradeDist.excellent.count / totalDistCount) * 100}%`}} className="bg-green-500 hover:opacity-90 transition-all cursor-pointer" title="ดีเยี่ยม (≥ 95%)"></div>
                                        <div style={{width: `${(analysisData.gradeDist.warning.count / totalDistCount) * 100}%`}} className="bg-yellow-400 hover:opacity-90 transition-all cursor-pointer" title="ระวัง (90-94%)"></div>
                                        <div style={{width: `${(analysisData.gradeDist.poor.count / totalDistCount) * 100}%`}} className="bg-red-500 hover:opacity-90 transition-all cursor-pointer" title="ต้องปรับปรุง (< 90%)"></div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-start">

                                            </div>
                                            <div className="max-h-[300px] overflow-y-auto overflow-x-hidden pr-1 menu-scroll space-y-1.5">
                                                {analysisData.gradeDist.excellent.stores.map((s, i) => (
                                                    <div key={i} className="flex justify-between items-center bg-white p-1.5 px-2 rounded border border-green-100 shadow-sm">
                                                        <div className="w-3/4 pr-2 overflow-hidden">
                                                            <div className="text-[11px] font-bold text-gray-700 truncate" title={`${s.code} ${s.name}`}>{s.code} <span className="font-normal text-gray-500">{s.name}</span></div>
                                                            <div className="text-[9px] text-gray-400 font-medium truncate">{s.dept} | {s.zone}</div>
                                                        </div>
                                                        <div className="text-xs font-black text-green-600 shrink-0">{s.pct}%</div>
                                                    </div>
                                                ))}
                                                {analysisData.gradeDist.excellent.count === 0 && <div className="text-center text-xs text-green-400 py-2">ไม่มีสาขาในเกณฑ์นี้</div>}
                                            </div>
                                        </div>
                                        <div className="bg-yellow-50 rounded-lg p-3 border border-yellow-100 flex flex-col">
                                            <div className="text-center mb-3 pb-2 border-b border-yellow-200/50">
                                                <div className="text-sm font-bold text-yellow-700">เฝ้าระวัง</div>
                                                <div className="text-2xl font-black text-yellow-600">{analysisData.gradeDist.warning.count} <span className="text-[12px] text-yellow-500 font-normal">สาขา</span></div>
                                            </div>
                                            <div className="max-h-[300px] overflow-y-auto overflow-x-hidden pr-1 menu-scroll space-y-1.5">
                                                {analysisData.gradeDist.warning.stores.map((s, i) => (

                                                {analysisData.gradeDist.poor.stores.map((s, i) => (
                                                    <div key={i} className="flex justify-between items-center bg-white p-1.5 px-2 rounded border border-red-100 shadow-sm">
                                                        <div className="w-3/4 pr-2 overflow-hidden">
                                                            <div className="text-[11px] font-bold text-gray-700 truncate" title={`${s.code} ${s.name}`}>{s.code} <span className="font-normal text-gray-500">{s.name}</span></div>
                                                            <div className="text-[9px] text-gray-400 font-medium truncate">{s.dept} | {s.zone}</div>
                                                        </div>
                                                        <div className="text-xs font-black text-red-600 shrink-0">{s.pct}%</div>

                        {analysisData.criticalAlerts.length > 0 && (
                            <div className="bg-red-50 rounded-xl shadow-sm border-2 border-red-300 p-5 md:p-6 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-10">

                                </div>

                                        <tfoot>
                                            <tr className="bg-gray-800 text-white font-extrabold text-sm md:text-lg border-t-4 border-yellow-400">
                                                <td colSpan="3" className="px-3 md:px-5 py-3 md:py-5 text-right uppercase tracking-wider">Total (รวม)</td>
                                                <td className="px-1 md:px-5 py-3 md:py-5 border-l border-gray-600">100%</td>
                                                <td className="px-2 md:px-5 py-3 md:py-5 border-l border-gray-600 text-lg md:text-2xl text-yellow-400 bg-gray-900">{totalWeightedPercentage}%</td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </div>

                            <div id="section-signature" className="mt-8 md:mt-16 grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-10 pt-6 md:pt-10 border-t-2 border-gray-300 page-break-inside-avoid scroll-mt-6 w-full">
                                <SignaturePad key={`manager-${formKey}`} title="ลงชื่อ ผู้จัดการร้านสาขา (ผู้รับทราบ)" onSignatureChange={(dataUrl) => setSignatures({...signatures, manager: dataUrl})} readOnlyImage={viewingRecord ? signatures.manager : null} />
                                <SignaturePad key={`auditor-${formKey}`} title="ลงชื่อ ผู้จัดการเขต (ผู้ตรวจ)" onSignatureChange={(dataUrl) => setSignatures({...signatures, auditor: dataUrl})} readOnlyImage={viewingRecord ? signatures.auditor : null} />
                            </div>

                            {!viewingRecord && (
                                <div className="no-print mt-8 md:mt-16 pt-4 md:pt-8 border-t-2 border-dashed border-gray-300 flex justify-center w-full px-2">
                                    <button onClick={handleSaveToDatabase} disabled={isSaving} className="w-full md:w-auto bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-extrabold py-3.5 md:py-4 px-6 md:px-10 rounded-xl shadow-xl flex justify-center items-center gap-2 md:gap-3 text-sm md:text-lg transition-transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed border-b-4 border-yellow-600 active:border-b-0 active:translate-y-1">
                                        <svg className="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                                        {isSaving ? 'กำลังบันทึกข้อมูล...' : 'บันทึกข้อมูลการประเมิน (Save to Cloud)'}
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                    )}

                    {/* ระบบป๊อปอัปขยายรูปภาพเต็มจอ (Image Viewer Modal) */}
                    {fullScreenImage && (
                        <div className="fixed inset-0 z-[9999] bg-black bg-opacity-90 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity" onClick={() => setFullScreenImage(null)}>
                            <div className="relative max-w-5xl max-h-[90vh] w-full flex justify-center items-center" onClick={(e) => e.stopPropagation()}>
                                <img src={fullScreenImage} alt="Fullscreen View" className="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl" />
                                <button onClick={() => setFullScreenImage(null)} className="absolute -top-12 right-0 md:-right-12 md:top-0 text-white hover:text-red-400 bg-gray-800 bg-opacity-50 hover:bg-opacity-100 rounded-full p-2 transition-all shadow-lg border border-gray-600">
                                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
