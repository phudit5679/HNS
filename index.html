<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Café Amazon Quality Audit</title>

    <script>
        if (typeof window !== 'undefined') {
            window.process = { env: { NODE_ENV: 'production' } };
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        const originalConsoleError = console.error;
       console.error = function(...args) {
            try {
                const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
                if (msg.includes('isTrusted') || msg.includes('UNHANDLEDREJECTION')) return;
            } catch (e) {}
            originalConsoleError.apply(console, args);
        };

        window.onunhandledrejection = function(event) {
            if (event && event.preventDefault) event.preventDefault();
            return true;
        };

        window.addEventListener('unhandledrejection', function(event) {
            if (event && event.preventDefault) event.preventDefault();
            if (event && event.stopPropagation) event.stopPropagation();
            if (event && event.stopImmediatePropagation) event.stopImmediatePropagation();
        }, true);

        window.addEventListener('error', function(event) {
            if (event && (event.isTrusted || (event.message && event.message.includes('isTrusted')))) {
                if (event.preventDefault) event.preventDefault();
            }
        }, true);
    </script>

    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }

        @media print {
            .no-print, nav, .dashboard-view { display: none !important; }
            body { background-color: white; }
            .print-container { box-shadow: none !important; margin: 0 !important; padding: 0 !important; max-width: 100% !important; width: 100% !important; }
            #printable-area { border: none !important; padding: 0 !important; }
        }

        tr, .page-break-inside-avoid { page-break-inside: avoid !important; }

        .table-scroll::-webkit-scrollbar { height: 6px; }
        .table-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .table-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

        .menu-scroll::-webkit-scrollbar { width: 5px; }
        .menu-scroll::-webkit-scrollbar-track { background: transparent; }
        .menu-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        html { scroll-behavior: smooth; }

        /* แก้บั๊ก Tailwind img inline-block ทำให้ตัวหนังสือตกตอนทำ PDF */
        .pdf-mode img { display: inline-block !important; }
        .pdf-mode textarea { white-space: pre-wrap !important; word-break: break-word !important; }
        .pdf-mode * { letter-spacing: normal !important; }

        /* เพิ่ม CSS อนิเมชันสำหรับกระพริบแจ้งเตือน */
        @keyframes pulse-error {
            0%, 100% { background-color: transparent; outline: 2px solid transparent; }
            50% { background-color: #fee2e2; outline: 3px solid #ef4444; outline-offset: -2px; }
        }
        .error-flash {
            animation: pulse-error 0.6s ease-in-out 4 !important; /* กระพริบ 4 ครั้ง */
            border-radius: 8px;
            position: relative;
            z-index: 10;
        }
        /* บังคับให้พื้นหลังลูกโปร่งใสชั่วคราว เพื่อให้เห็นสีแดง */
        .error-flash td, .error-flash div {
            background-color: transparent !important;
        }
    </style>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, getDoc, doc, updateDoc, deleteDoc, setDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ====== ตั้งค่าที่เก็บรูปบน Google Drive (ผ่าน Google Apps Script) ======
        // วางลิงก์ Web app ของ Apps Script และรหัสลับ (TOKEN) ให้ตรงกับในสคริปต์
        // ถ้าเว้นว่างไว้ ระบบจะเก็บรูปใน Firebase แบบเดิม
        const IMAGE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxNmJYWHz16TZgFhLdJjgvfq-ymnBsWHitG8aFSmpoqJs_YPoVJit6vU1yAazXbhUj-/exec';
        const IMAGE_SCRIPT_TOKEN = 'hns-audit-2407657';
        const useDrive = () => IMAGE_SCRIPT_URL !== '' && IMAGE_SCRIPT_TOKEN !== '';

        // ส่งเป็น text/plain เพื่อไม่ให้เบราว์เซอร์ส่ง preflight ซึ่ง Apps Script ไม่รองรับ
        const callImageScriptOnce = async (payload) => {
            let res;
            try {
                res = await fetch(IMAGE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ ...payload, token: IMAGE_SCRIPT_TOKEN })
                });
            } catch (e) {
                const err = new Error(`เชื่อมต่อ Google Drive ไม่ได้ (${e.message}) กรุณาเช็กสัญญาณอินเทอร์เน็ต`);
                err.transient = true;
                throw err;
            }
            const text = await res.text();
            let result;
            try {
                result = JSON.parse(text);
            } catch (e) {
                // Apps Script ตอบเป็นหน้าเว็บแทน JSON: Google ขัดข้องชั่วคราว, สคริปต์มี error, ยังไม่ได้ Authorize หรือตั้งสิทธิ์ไม่เป็น Anyone
                const page = new DOMParser().parseFromString(text, 'text/html');
                const detail = (page.querySelector('.errorMessage')?.textContent || page.title || page.body?.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 200);
                const err = new Error(`Google Drive (Apps Script) ตอบกลับผิดรูปแบบ: ${detail || `HTTP ${res.status}`}\nกรุณาเช็ก Apps Script → การดำเนินการ (Executions)`);
                err.transient = true;
                throw err;
            }
            if (!result.ok) throw new Error(`Google Drive: ${result.error || 'ไม่ทราบสาเหตุ'}`);
            return result;
        };

        // Apps Script บริการฟรีขัดข้องชั่วคราวได้บ้าง (เช่น ตอนเพิ่งตื่นจากการพัก) จึงลองใหม่อัตโนมัติสูงสุด 2 ครั้ง
        // ไม่ลองใหม่เมื่อสคริปต์ตอบ error ชัดเจน (เช่น รหัสลับผิด) เพราะลองกี่ครั้งก็ไม่ผ่าน
        const callImageScript = async (payload) => {
            for (let attempt = 0; ; attempt++) {
                try {
                    return await callImageScriptOnce(payload);
                } catch (e) {
                    if (!e.transient || attempt >= 2) throw e;
                    await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
                }
            }
        };

        // ชื่อโฟลเดอร์ใน Drive: "2569-10 ต.ค." / "S001 สาขาบางนา 15-10-2569"
        const THAI_MONTHS = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
        const driveFolderNames = (storeInfo = {}) => {
            const [y, m, d] = String(storeInfo.date || '').split('-');
            const thaiYear = y ? parseInt(y, 10) + 543 : '';
            const folderName = [storeInfo.code, storeInfo.name, d && m ? `${d}-${m}-${thaiYear}` : '']
                .filter(Boolean).join(' ').replace(/[\\/]/g, '-');
            const monthFolderName = y && m ? `${thaiYear}-${m} ${THAI_MONTHS[parseInt(m, 10) - 1]}` : '';
            return { folderName, monthFolderName };
        };

        const getFirebaseInstances = async () => {
            const firebaseConfig = {
                apiKey: "AIzaSyC6-ssnjycj_jGoq9K2mdHfp8GEHOWJy_o",
                authDomain: "cafe--quality-audit-form.firebaseapp.com",
                projectId: "cafe--quality-audit-form",
                storageBucket: "cafe--quality-audit-form.firebasestorage.app",
                messagingSenderId: "105074767438",
                appId: "1:105074767438:web:d3c54d1e324c392a96751f",
                measurementId: "G-4ND99W0P4H"
            };

            const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
            const db = getFirestore(app);

            const userId = 'audit-user-' + Math.floor(Math.random() * 1000000);

            return { db, userId, appId: firebaseConfig.appId };
        };

        // รูปภาพแบบเก็บใน Firebase: 1 รูป = 1 เอกสาร ใน subcollection "images" (กันเอกสารหลักเกิน 1MB ของ Firestore)
        const imagesCol = (db, appId, auditId) => collection(db, 'artifacts', appId, 'public', 'data', 'audits', auditId, 'images');

        const saveImages = async (db, appId, auditId, images) => {
            const col = imagesCol(db, appId, auditId);
            const existing = await getDocs(col);
            await Promise.all(existing.docs.filter(d => !images[d.id]).map(d => deleteDoc(d.ref)));
            await Promise.all(Object.entries(images).map(([itemId, data]) => setDoc(doc(col, itemId), { data })));
        };

        window.initFirebaseAndSave = async (data, docId = null, images = {}, onProgress = null) => {
            let auditId = docId;
            try {
               const { db, userId, appId } = await getFirebaseInstances();
               if (!db) throw new Error("ไม่สามารถเชื่อมต่อฐานข้อมูลได้");

               // ล้างรูปเก่าที่เคยฝังอยู่ในเอกสารหลัก (ข้อมูลรุ่นก่อน)
               const body = { ...data, images: {} };
               const imageCount = Object.keys(images).length;

               if (onProgress) onProgress('กำลังบันทึกข้อมูลคะแนนลงระบบ...');
               if (docId) {
                   const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'audits', docId);
                   await updateDoc(docRef, { ...body, updatedBy: userId, updatedAt: new Date().toISOString() });
               } else {
                   const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'audits');
                   const ref = await addDoc(colRef, { ...body, submittedBy: userId });
                   auditId = ref.id;
               }

               if (onProgress) onProgress(`กำลังอัปโหลดรูปภาพ (${imageCount} รูป)...\nกรุณาอย่าปิดหน้าจอ`);
               const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'audits', auditId);
               if (useDrive()) {
                   // ตอนแก้ไข ใช้โฟลเดอร์เดิมที่จำไว้ (สคริปต์จะเปลี่ยนชื่อให้ตรงกับข้อมูลล่าสุด)
                   const existing = docId ? (await getDoc(docRef)).data() : null;
                   const folderInfo = { auditId, folderId: existing?.driveFolderId || '', ...driveFolderNames(data.storeInfo) };
                   let folderId = '';
                   try {
                       folderId = (await callImageScript({ action: 'prepare', ...folderInfo })).folderId;
                   } catch (e) {
                       // Apps Script รุ่นเก่ายังไม่มีคำสั่ง prepare: ส่งรูปทั้งหมดในคำสั่งเดียวแบบเดิม
                       if (!String(e.message).includes('ไม่รู้จักคำสั่ง')) throw e;
                       folderId = (await callImageScript({ action: 'save', ...folderInfo, images })).folderId || '';
                       folderInfo.legacy = true;
                   }
                   // จำโฟลเดอร์ไว้ทันที ถ้าอัปโหลดรูปล้มเหลวแล้วกดลองใหม่ จะใช้โฟลเดอร์เดิม ไม่สร้างซ้ำ
                   if (folderId) await updateDoc(docRef, { driveFolderId: folderId });
                   if (!folderInfo.legacy) {
                       // ส่งรูปพร้อมกันครั้งละ 6 รูป (Apps Script รันพร้อมกันได้จำกัด)
                       const entries = Object.entries(images);
                       let done = 0;
                       for (let i = 0; i < entries.length; i += 6) {
                           await Promise.all(entries.slice(i, i + 6).map(async ([itemId, imgData]) => {
                               await callImageScript({ action: 'upload', auditId, folderId, itemId, data: imgData });
                               done++;
                               if (onProgress) onProgress(`กำลังอัปโหลดรูปภาพ... (${done}/${entries.length})\nกรุณาอย่าปิดหน้าจอ`);
                           }));
                       }
                   }
                   await updateDoc(docRef, { imagesInDrive: true, ...(folderId ? { driveFolderId: folderId } : {}) });
                   // ลบรูปที่อาจค้างอยู่ใน Firebase จากการบันทึกรุ่นก่อน
                   await saveImages(db, appId, auditId, {});
               } else {
                   await saveImages(db, appId, auditId, images);
                   if (docId) await updateDoc(docRef, { imagesInDrive: false });
               }
               return auditId;
            } catch (error) {
               console.error("Firebase Save Error:", error);
               // แจ้งรหัสรายการที่สร้างไปแล้ว ให้หน้าเว็บบันทึกทับรายการเดิมตอนลองใหม่
               error.auditId = auditId;
               throw error;
            }
        };

        window.fetchAuditImages = async (docId, imagesInDrive = false, driveFolderId = '') => {
            try {
               if (imagesInDrive) {
                   if (!useDrive()) return {};
                   const result = await callImageScript({ action: 'load', auditId: docId, folderId: driveFolderId || '' });
                   return result.images || {};
               }
               const { db, appId } = await getFirebaseInstances();
               const snapshot = await getDocs(imagesCol(db, appId, docId));
               const result = {};
               snapshot.forEach(d => { result[d.id] = d.data().data; });
               return result;
            } catch (error) {
               console.error("Image Fetch Error:", error);
               return {};
            }
        };

        window.deleteAuditRecord = async (docId) => {
            try {
               const { db, appId } = await getFirebaseInstances();
               if (!db) throw new Error("ไม่สามารถเชื่อมต่อฐานข้อมูลได้");
               if (useDrive()) {
                   try {
                       const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'audits', docId));
                       await callImageScript({ action: 'delete', auditId: docId, folderId: snap.data()?.driveFolderId || '' });
                   }
                   catch (e) { console.warn("Drive delete failed", e); }
               }
               const imgs = await getDocs(imagesCol(db, appId, docId));
               await Promise.all(imgs.docs.map(d => deleteDoc(d.ref)));
               const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'audits', docId);
               await deleteDoc(docRef);
               return true;
            } catch (error) {
               console.error("Firebase Delete Error:", error);
               throw error;
            }
        };

        // months = null ดึงทั้งหมด, หรือส่งรายการเดือน เช่น ['2026-10'] เพื่อดึงเฉพาะเดือนนั้น (ประหยัดโควตาการอ่าน)
        window.fetchAuditHistory = async (months = null) => {
            try {
               const { db, appId } = await getFirebaseInstances();
               if (!db) return [];

               const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'audits');
               const snapshots = [];
               if (months === null) {
                   snapshots.push(await getDocs(colRef));
               } else {
                   // where 'in' รับได้ครั้งละไม่เกิน 30 ค่า
                   for (let i = 0; i < months.length; i += 30) {
                       snapshots.push(await getDocs(query(colRef, where('month', 'in', months.slice(i, i + 30)))));
                   }
               }
               const data = [];
               snapshots.forEach(snapshot => snapshot.forEach(doc => data.push({ id: doc.id, ...doc.data() })));
               return data.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            } catch (error) {
               console.error("Firebase Fetch Error:", error.message);
               return [];
            }
        };
    </script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            componentDidCatch(error, errorInfo) {
                this.setState({ error, errorInfo });
                console.error("React Error Caught:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-red-50 p-4 md:p-8 flex flex-col items-center justify-center text-center">
                            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-xl max-w-2xl w-full border-t-8 border-red-500">
                                <div className="text-6xl mb-4">💥</div>
                                <h1 className="text-2xl font-bold text-gray-800 mb-2">หน้าจอเกิดข้อผิดพลาด (App Crashed)</h1>
                                <p className="text-gray-600 mb-6 font-medium">กรุณาถ่ายภาพหน้าจอนี้ส่งให้ทีมพัฒนา เพื่อทำการแก้ไขให้กลับมาใช้งานได้ครับ</p>
                                <div className="text-left bg-gray-100 p-4 rounded-lg overflow-x-auto text-sm text-red-600 font-mono border border-gray-200 shadow-inner">
                                    <p className="font-bold border-b border-gray-300 pb-2 mb-2">{this.state.error && this.state.error.toString()}</p>
                                    <pre className="mt-2 text-[10px] md:text-xs text-gray-500">{this.state.errorInfo && this.state.errorInfo.componentStack}</pre>
                                </div>
                                <button onClick={() => window.location.reload()} className="mt-6 bg-red-500 hover:bg-red-600 text-white font-bold py-2.5 px-6 rounded-lg transition-colors">
                                    รีเฟรชหน้าจอ (ลองใหม่)
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const SignaturePad = ({ title, onSignatureChange, readOnlyImage }) => {
            const canvasRef = React.useRef(null);
            const [isDrawing, setIsDrawing] = React.useState(false);

            const [penColor, setPenColor] = React.useState('#1f2937');
            const [penWidth, setPenWidth] = React.useState(3);

            React.useEffect(() => {
                if (readOnlyImage || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0,0, canvas.width, canvas.height);
            }, [readOnlyImage]);

            const getCoordinates = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
               if (e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
                }
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            };

            const startDrawing = (e) => {
                if(readOnlyImage) return;
                e.preventDefault();
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');

                ctx.lineWidth = penWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = penColor;

                ctx.beginPath();
                ctx.moveTo(x, y);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if(readOnlyImage) return;
                e.preventDefault();
                if (!isDrawing) return;
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');

                ctx.lineWidth = penWidth;
                ctx.strokeStyle = penColor;

                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                if(readOnlyImage) return;
                if (isDrawing) {
                    setIsDrawing(false);
                    onSignatureChange(canvasRef.current.toDataURL('image/jpeg', 0.7));
                }
            };

            const clearPad = () => {
                if(readOnlyImage) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0,0, canvas.width, canvas.height);
                onSignatureChange(null);
            };

            const today = new Date();
            const displayDate = `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear() +543}`;

            if (readOnlyImage) {
                return (
                    <div className="flex flex-col items-center">
                        <p className="text-base font-bold text-gray-800 mb-2 text-center">{title}</p>
                        <div className="border-2 border-gray-300 rounded-xl overflow-hidden bg-white shadow-sm w-[300px] h-[140px] flex items-center justify-center">
                            {readOnlyImage.startsWith('data:image') ? <img src={readOnlyImage} alt="Signature" className="max-w-full max-h-full" /> : <span className="text-gray-400">ไม่มีลายเซ็น</span>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col items-center w-full px-2">
                    <p className="text-sm md:text-base font-bold text-gray-800 mb-2 text-center">{title}</p>
                    <div className="border-2 border-gray-300 rounded-xl overflow-hidden bg-white shadow-inner w-full max-w-[320px]" style={{ touchAction: 'none' }}>
                        <canvas
                            ref={canvasRef}
                            width={320}
                            height={140}
                            className="bg-white cursor-crosshair touch-none w-full"
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseOut={stopDrawing}

                    { id: '5.3', desc: 'แสดงใบอนุญาตจัดตั้งสถานที่จำหน่ายอาหาร/ใบภาษีป้าย/สถานที่สะสมอาหาร และ ภพ. 20 ตามกฎหมายกำหนด เอกสารไม่หมดอายุ', maxIn: 40, maxOut: 40, menuName: '5.3 ใบอนุญาต/ภาษีป้าย ไม่หมดอายุ' },
                    { id: '5.4', desc: 'ตำแหน่ง ผู้จัดการ ทำหน้าที่ผู้จัดการ รักษาการผู้จัดการ ต้องผ่านการอบรมหลักสูตร ผู้ประกอบกิจการ และ เอกสารไม่หมดอายุ', maxIn: 40, maxOut: 40, menuName: '5.4 ผจก.ผ่านอบรม/เอกสารสมบูรณ์' },
                    { id: '5.5', desc: 'ตำแหน่ง ผู้ช่วยผู้จัดการ Barista(ที่อายุงานครบ 4 เดือน ต้องผ่านการอบรมหลักสูตร ผู้สัมผัสอาหาร และ เอกสารไม่หมดอายุ', maxIn: 40, maxOut: 40, menuName: '5.5 บาริสต้าผ่านอบรมสัมผัสอาหาร' },
                    { id: '5.6', desc: 'ป้ายสื่อ PDPA / CCTV / ห้ามสูบบุหรี ติดตั้ง ถูกต้องครบถ้วน ไม่สกปรก ซีด หรือ ฉีกขาด (ถ่ายรูป CCTV ว่าครบทุกช่องไหม)', maxIn: 5, maxOut: 5, requireImage: true, menuName: '5.6 ป้าย PDPA/CCTV/ห้ามสูบบุหรี่' },
                    { id: '5.7', desc: 'ป้ายโลโก้ Café Amazon และ ป้าย คาเฟ่อเมซอน(ภาษาไทย) อยู่ในสภาพดี สะอาด ปลอดภัย ไม่ชำรุด ทรุดโทรม', maxIn: 5, maxOut: 5, menuName: '5.7 ป้ายโลโก้ Cafe Amazon' }

        ];

        const App = () => {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const currentDate = `${yyyy}-${mm}-${dd}`;
            const currentYYYY_MM = `${yyyy}-${mm}`;

            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const currentTime = `${hh}:${min}`;

            const [currentView, setCurrentView] = React.useState('form');
            const [auditHistory, setAuditHistory] = React.useState([]);
            const [isLoadingHistory, setIsLoadingHistory] = React.useState(false);
            const [isExportingZip, setIsExportingZip] = React.useState(false);

            const [filterMonth, setFilterMonth] = React.useState(currentYYYY_MM);
            const [filterSearch, setFilterSearch] = React.useState('');
            const [filterDept, setFilterDept] = React.useState('');
            const [filterRegion, setFilterRegion] = React.useState('');
            const [filterScore, setFilterScore] = React.useState('');
            const [filterStatus, setFilterStatus] = React.useState('');
            const [filterGrade, setFilterGrade] = React.useState('');
            const [storeSearchInput, setStoreSearchInput] = React.useState('');
           const [showStoreDropdown, setShowStoreDropdown] = React.useState(false);
            const searchInputRef = React.useRef(null);

            const [fullScreenImage, setFullScreenImage] = React.useState(null);

            const [currentPage, setCurrentPage] = React.useState(1);
            const itemsPerPage = 50;

            const [viewingRecord, setViewingRecord] = React.useState(null);
            const [editingId, setEditingId] = React.useState(null);
            const [deleteConfirm, setDeleteConfirm] = React.useState({ show: false, docId: null, storeCode: '' });

            const [auditStartTime, setAuditStartTime] = React.useState(Date.now());

            const [storeInfo, setStoreInfo] = React.useState({ code: '', name: '', province: '', department: '', zone: '', auditor: '', date: currentDate, time: currentTime, storeType: 'out', latitude: '', longitude: '', mapLink: '' });
            const [scores, setScores] = React.useState({});
            const [remarks, setRemarks] = React.useState({});
            const [measurements, setMeasurements] = React.useState({});
            const [images, setImages] = React.useState({});
            const [imageLoading, setImageLoading] = React.useState({});
            const [checkedItems, setCheckedItems] = React.useState({});
            const [signatures, setSignatures] = React.useState({ manager: null, auditor: null });
            const [storeDataList, setStoreDataList] = React.useState([]);
            const [showCodeDropdown, setShowCodeDropdown] = React.useState(false);
            const [showNameDropdown, setShowNameDropdown] = React.useState(false);
            const [showMenu, setShowMenu] = React.useState(false);
            const [menuPos, setMenuPos] = React.useState(null);
            const [expandedTocSections, setExpandedTocSections] = React.useState({});
            const [isSaving, setIsSaving] = React.useState(false);
            const [modalInfo, setModalInfo] = React.useState({ show: false, message: '', isError: false });
            const [hasDraft, setHasDraft] = React.useState(false);

            const [lastAutoSave, setLastAutoSave] = React.useState(null);
            // เปลี่ยนค่าทุกครั้งที่ล้างฟอร์ม เพื่อสร้างช่องเซ็นชื่อใหม่ (ภาพลายเซ็นเก่าจะได้ไม่ค้างบนจอ)
            const [formKey, setFormKey] = React.useState(0);

            const latestDataRef = React.useRef({ storeInfo, scores, remarks, measurements, checkedItems, signatures, images, auditStartTime, editingId });
            // ลายนิ้วมือของข้อมูลที่บันทึกขึ้น Cloud ล่าสุด ใช้กัน Auto Save สร้าง draft ซ้ำหลังบันทึกสำเร็จ
            const lastCloudSaveRef = React.useRef(null);
            const getDataFingerprint = (d) => JSON.stringify([d.storeInfo, d.scores, d.remarks, d.measurements, d.checkedItems, Object.keys(d.images).sort(), !!d.signatures.manager, !!d.signatures.auditor]);

            // อัปเดตข้อมูลล่าสุดเก็บไว้ใน Ref เพื่อให้ Auto Save เอาไปใช้ได้โดยไม่ต้องรีเซ็ตเวลาใหม่ทุกครั้งที่พิมพ์
            React.useEffect(() => {
                latestDataRef.current = { storeInfo, scores, remarks, measurements, checkedItems, signatures, images, auditStartTime, editingId };
            }, [storeInfo, scores, remarks, measurements, checkedItems, signatures, images, auditStartTime, editingId]);

            // ระบบ Auto Save ทำงานทุก 15 วินาที (และครั้งแรกทำงานเมื่อผ่านไป 10 วินาที)
            React.useEffect(() => {
                const performAutoSave = () => {
                    const data = latestDataRef.current;
                    // ไม่บันทึกถ้าเป็นโหมดดูข้อมูล
                    if (viewingRecord) return;

                    // เช็คว่ามีข้อมูลอะไรให้เซฟไหม (อนุญาตให้เซฟได้แม้ยังไม่ได้กรอกรหัสสาขา)
                    const hasData = data.storeInfo.code !== '' || Object.keys(data.scores).length > 0 || Object.keys(data.images).length > 0;
                    if (!hasData) return;

                    // ข้อมูลเหมือนที่เพิ่งบันทึกขึ้น Cloud แล้ว ไม่ต้องเก็บ draft ซ้ำ
                    if (lastCloudSaveRef.current && lastCloudSaveRef.current === getDataFingerprint(data)) return;

                    try {
                        const draftData = { ...data, timestamp: new Date().toISOString() };
                        localStorage.setItem('cafe_audit_draft', JSON.stringify(draftData));

                        const now = new Date();
                        setLastAutoSave(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`);
                        setHasDraft(true);
                    } catch (error) {
                        console.warn("Auto-save failed (Storage limit reached)");
                    }
                };

                // เรียกใช้ครั้งแรกให้เร็วขึ้น
                const initialSave = setTimeout(performAutoSave, 10000);

                // วนลูปทำงานทุก 15 วินาที
                const interval = setInterval(performAutoSave, 15000);

                return () => {
                    clearTimeout(initialSave);
                    clearInterval(interval);
                };
            }, [viewingRecord]);

            const dragRef = React.useRef({ isDragging: false, startX: 0, startY: 0, initMenuX: 0, initMenuY: 0, moved: false });

            const handleTouchStart = (e) => {
                const touch = e.touches[0];
                const rect = e.currentTarget.getBoundingClientRect();
                dragRef.current = {
                    isDragging: true, startX: touch.clientX, startY: touch.clientY,
                    initMenuX: rect.left, initMenuY: rect.top, moved: false
                };
            };

            const handleTouchMove = (e) => {
                if (!dragRef.current.isDragging) return;
                const touch = e.touches[0];
                const dx = touch.clientX - dragRef.current.startX;
                const dy = touch.clientY - dragRef.current.startY;

                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    dragRef.current.moved = true;
                    if (showMenu) setShowMenu(false);
                }

                if (dragRef.current.moved) {
                     e.cancelable && e.preventDefault();
                     let newX = dragRef.current.initMenuX + dx;
                     let newY = dragRef.current.initMenuY + dy;

                     const btnSize = 56;
                     if(newX < 0) newX = 0;
                     if(newY < 0) newY = 0;
                     if(newX > window.innerWidth - btnSize) newX = window.innerWidth - btnSize;
                     if(newY > window.innerHeight - btnSize) newY = window.innerHeight - btnSize;

                     setMenuPos({ x: newX, y: newY });
                }
            };

            const handleTouchEnd = (e) => { dragRef.current.isDragging = false; };

            const handleMouseDown = (e) => {
                if (e.button !== 0) return;
                const rect = e.currentTarget.getBoundingClientRect();
                dragRef.current = {
                    isDragging: true, startX: e.clientX, startY: e.clientY,
                    initMenuX: rect.left, initMenuY: rect.top, moved: false
                };

                const onMouseMove = (moveEvent) => {
                    const dx = moveEvent.clientX - dragRef.current.startX;
                    const dy = moveEvent.clientY - dragRef.current.startY;
                    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                        dragRef.current.moved = true;
                        if (showMenu) setShowMenu(false);
                    }
                    if(dragRef.current.moved) {
                         let newX = dragRef.current.initMenuX + dx;
                         let newY = dragRef.current.initMenuY + dy;
                         const btnSize = 56;
                         if(newX < 0) newX = 0;
                         if(newY < 0) newY = 0;
                         if(newX > window.innerWidth - btnSize) newX = window.innerWidth - btnSize;
                         if(newY > window.innerHeight - btnSize) newY = window.innerHeight - btnSize;
                         setMenuPos({ x: newX, y: newY });
                    }
                };

                const onMouseUp = () => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    dragRef.current.isDragging = false;
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            };

            React.useEffect(() => {
                const fetchStoreData = async () => {
                    try {
                        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1wWjt_kkgH3fqv5SPTO7Ysq6HH01yZTU0/gviz/tq?tqx=out:csv';
                        const res = await fetch(sheetUrl);
                        if (!res.ok) throw new Error('Cannot fetch data');
                        const csvText = await res.text();

                        const rows = csvText.split('\n');
                        const parseCSVLine = (text) => {
                            let ret = [], keep = false, token = '';
                            for (let i = 0; i < text.length; i++) {
                                let ch = text[i];
                                if (ch === '"') keep = !keep;
                                else if (ch === ',' && !keep) { ret.push(token); token = ''; }
                                else token += ch;
                            }
                            ret.push(token);
                            return ret.map(t => t.replace(/^"|"$/g, '').trim());
                        };

                        const parsedData = rows.slice(1).map(row => {
                            const cleanCols = parseCSVLine(row);
                            return {
                                department: cleanCols[2] || '',
                                zone: cleanCols[4] || '',
                                code: cleanCols[5] || '',
                                name: cleanCols[6] || '',
                                province: cleanCols[7] || '',
                                auditor: cleanCols[4] || ''
                            };
                        }).filter(s => s.code || s.name);

                        setStoreDataList(parsedData);
                    } catch (error) {
                        console.error("Error fetching Google Sheet:", error);
                    }
                };
                fetchStoreData();
            }, []);

            React.useEffect(() => {
                const draft = localStorage.getItem('cafe_audit_draft');
                if (draft) setHasDraft(true);
            }, []);

            React.useEffect(() => {
                setCurrentPage(1);
            }, [filterMonth, filterSearch, filterDept, filterRegion, filterScore, filterStatus]);

            // ====== โหลดประวัติแบบรายเดือน (ประหยัดโควตาการอ่านของ Firebase แพ็กเกจฟรี) ======
            // เก็บว่าเดือนไหนโหลดมาแล้ว จะได้ไม่อ่านซ้ำ
            const loadedMonthsRef = React.useRef(new Set());
            const loadedAllRef = React.useRef(false);
            const [historyVersion, setHistoryVersion] = React.useState(0);

            const shiftMonth = (yyyy_mm, delta) => {
                const [y, m] = yyyy_mm.split('-').map(Number);
                const d = new Date(y, m - 1 + delta, 1);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            };
            const lastNMonths = (n) => Array.from({ length: n }, (_, i) => shiftMonth(currentYYYY_MM, -i));

            // เดือนที่หน้าปัจจุบันต้องใช้ (null = ทุกเดือน)
            // หน้าวิเคราะห์ต้องใช้เดือนก่อนหน้าด้วย เพื่อเทียบเดือนต่อเดือนและหาข้อบกพร่องซ้ำซาก
            const getNeededMonths = () => {
                if (filterMonth === '') return null;
                return currentView === 'analysis' ? [filterMonth, shiftMonth(filterMonth, -1)] : [filterMonth];
            };

            const loadAuditHistory = async (forceRefresh = false, months = getNeededMonths()) => {
                if (!window.fetchAuditHistory) return;
                if (loadedAllRef.current && !forceRefresh) return;
                if (months !== null) {
                    if (!forceRefresh) months = months.filter(m => !loadedMonthsRef.current.has(m));
                    if (months.length === 0) return;
                }
                setIsLoadingHistory(true);
                const data = await window.fetchAuditHistory(months);
                if (months === null) {
                    loadedAllRef.current = true;
                    setAuditHistory(data);
                } else {
                    months.forEach(m => loadedMonthsRef.current.add(m));
                    setAuditHistory(prev => [...prev.filter(r => !months.includes(r.month)), ...data]
                        .sort((x, y) => new Date(y.createdAt) - new Date(x.createdAt)));
                }

                // ใช้ URL อ้างอิงไฟล์โดยตรง (เร็วกว่า FileReader ที่ต้องแปลงเป็น Text มากๆ)
                const objectUrl = URL.createObjectURL(file);

                // หน่วงเวลาให้ UI วาด Loading เสร็จก่อนเริ่มการบีบอัดรูป
                requestAnimationFrame(() => {
                    setTimeout(() => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            const MAX_WIDTH = 640;
                            const MAX_HEIGHT = 640;

                            if (width > height) {
                                if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                            } else {
                                if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                            }

                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.5);
                            setImages(prev => ({ ...prev, [itemId]: compressedDataUrl }));
                            setImageLoading(prev => ({ ...prev, [itemId]: false })); // ปิด Loading

                            // คืนพื้นที่หน่วยความจำเบราว์เซอร์
                            URL.revokeObjectURL(objectUrl);
                        };

                        img.onerror = () => {
                            setImageLoading(prev => ({ ...prev, [itemId]: false }));
                            URL.revokeObjectURL(objectUrl);
                        };

                        img.src = objectUrl;
                    }, 50);

            const getSectionTotal = (sectionItems) =>

            const getSectionMaxScore = (sectionItems) =>
                getVisibleItems(sectionItems).reduce((sum, item) => item.isHeader ? sum : sum + (storeInfo.storeType === 'in' ? (item.maxIn || 0) : (item.maxOut || 0)), 0);

            const calculatePercentages = (customScores = null, customType = null) => {
                const targetScores = customScores || scores;
                const targetType = customType || storeInfo.storeType;

                let totalWeightedPercentage = 0;
                let sumData = [];

                checklistSections.forEach(sec => {
                    const visibleItems = sec.items.filter(item => {
                        if (item.onlyFor && item.onlyFor !== targetType) return false;
                        if (item.isHeader || item.alwaysShow) return true;
                        return (targetType === 'in' ? item.maxIn : item.maxOut) > 0;
                    });

                    const actualScore = visibleItems.reduce((sum, item) => item.isHeader ? sum : sum + (targetScores[item.id] || 0),0);
                    const currentMaxScore = visibleItems.reduce((sum, item) => item.isHeader ? sum : sum + (targetType === 'in' ? (item.maxIn || 0) : (item.maxOut || 0)), 0);

                    const rawPercentage = currentMaxScore > 0 ? (actualScore / currentMaxScore) : 0;
                    const weightedPercentage = rawPercentage * sec.weight;
                    totalWeightedPercentage += weightedPercentage;
                    sumData.push({
                        title: sec.title.replace('. ', ' : '),
                        maxScore: currentMaxScore,
                        actualScore: actualScore,
                        weight: sec.weight,
                        achievedWeight: weightedPercentage.toFixed(2)
                    });
                });
                return { summaryData: sumData, totalWeightedPercentage: totalWeightedPercentage.toFixed(2)};
            };

            const { summaryData, totalWeightedPercentage } = calculatePercentages();

            const renderHighlightedText = (text, highlightWords = [], blueUnderlineWords = []) => {
                if (!text) return null;
                if ((!highlightWords || highlightWords.length === 0) && (!blueUnderlineWords || blueUnderlineWords.length === 0)) {
                    return <span>{text}</span>;
                }

                const allWords = [...(highlightWords || []), ...(blueUnderlineWords || [])].filter(Boolean);
                if (allWords.length === 0) return <span>{text}</span>;

                const escapeRegExp = (string) => string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const pattern = new RegExp(`(${allWords.map(escapeRegExp).join('|')})`, 'g');

                const parts = text.split(pattern);

                return (
                    <span>
                        {parts.map((part, i) => {
                            if (highlightWords && highlightWords.includes(part)) {
                                return <strong key={i} className="text-red-600">{part}</strong>;
                            } else if (blueUnderlineWords && blueUnderlineWords.includes(part)) {
                                return <span key={i} className="text-blue-600 underline font-bold">{part}</span>;

            const processPDF = async (filename) => {
                const originalElement = document.getElementById('printable-area');
                if (!originalElement) throw new Error("ไม่พบพื้นที่ที่ต้องการสร้าง PDF");

                // 1. สร้าง Loading Overlay ให้ครอบคลุมทั้งหน้าจอ
                const overlay = document.createElement('div');
                overlay.style.position = 'fixed';
                overlay.style.top = '0'; overlay.style.left = '0';

                overlay.innerHTML = `
                    <div style="width:60px;height:60px;border:6px solid #f3f4f6;border-top:6px solid #3b82f6;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:24px;"></div>
                    <div style="font-family:Prompt, sans-serif;font-size:20px;font-weight:bold;color:#1e293b;">กำลังจัดทำ PDF...</div>
                    <div style="font-family:Prompt, sans-serif;font-size:14px;color:#64748b;margin-top:8px;">โปรดรอสักครู่ ห้ามปิดหน้าจอ</div>
                `;
                document.body.appendChild(overlay);

                await new Promise(resolve => setTimeout(resolve, 100));

                let wrapper = null;
                try {
                    // 2. สร้าง Wrapper ซ่อนไว้ด้านหลัง
                    wrapper = document.createElement('div');
                    wrapper.style.position = 'absolute';
                    wrapper.style.top = '0';
                    wrapper.style.left = '0';
                    wrapper.style.width = '1024px';
                    wrapper.style.backgroundColor = '#ffffff';
                    wrapper.style.zIndex = '-9999';

                    const clone = originalElement.cloneNode(true);
                    clone.style.width = '1024px';
                    clone.style.padding = '30px';
                    clone.style.margin = '0';
                    clone.style.boxSizing = 'border-box';
                    clone.classList.remove('shadow-xl', 'border', 'mobile-full', 'max-w-full', 'shadow-none');

                    // 3. แปลง Input ให้กลายเป็น Text ธรรมดา
                    clone.querySelectorAll('textarea').forEach(ta => {
                        const div = document.createElement('div');
                        div.style.whiteSpace = 'pre-wrap'; div.style.fontSize = '12px'; div.style.padding = '8px';
                        div.style.backgroundColor = '#f9fafb'; div.style.borderRadius = '6px'; div.style.border = '1px solid #e5e7eb';
                        div.style.width = '100%'; div.style.boxSizing = 'border-box';
                        div.innerHTML = ta.value ? ta.value.replace(/\n/g, '<br>') : '-';
                        ta.parentNode.replaceChild(div, ta);
                    });

                    clone.querySelectorAll('input[type="text"], input[type="date"], input[type="time"]').forEach(input => {
                        const div = document.createElement('div');
                        div.className = input.className;
                        div.style.display = 'block';
                        div.style.textAlign = input.classList.contains('text-center') ? 'center' : 'left';
                        div.style.boxSizing = 'border-box';
                        div.innerText = input.value || '-';
                        input.parentNode.replaceChild(div, input);
                    });

                    clone.querySelectorAll('select').forEach(select => {
                        const div = document.createElement('div');
                        div.className = select.className;
                        div.style.display = 'block';
                        div.style.textAlign = 'center';
                        div.style.paddingTop = '6px';
                        div.style.boxSizing = 'border-box';
                        const selected = select.options[select.selectedIndex];
                        div.innerText = selected && selected.value !== '' && !selected.text.includes('ระบุ') ? selected.text : '-';
                        select.parentNode.replaceChild(div, select);
                    });

                    // 4. แปลงคลาส Tailwind มือถือ ให้กลายเป็น Desktop แบบเด็ดขาด
                    const allEls = clone.querySelectorAll('*');
                    allEls.forEach(el => {
                        if (el.className && typeof el.className === 'string') {
                            let classArray = el.className.split(' ').filter(Boolean);
                            let newClasses = [];
                            const hasTableRow = classArray.includes('md:table-row');
                            const hasTableCell = classArray.includes('md:table-cell');
                            const hasTableHeader = classArray.includes('md:table-header-group');

                            classArray.forEach(c => {
                                // กำจัดคลาสที่ทำให้ Layout พัง (รวมถึงคลาส hidden ที่ซ่อนคอลัมน์คะแนนเต็มไว้)
                                if (hasTableRow && ['flex', 'flex-col', 'block'].includes(c)) return;
                                if (hasTableCell && ['block', 'flex', 'w-full', 'hidden', 'flex-col'].includes(c)) return;
                                if (hasTableHeader && ['hidden', 'block', 'flex'].includes(c)) return;
                                if (c === 'w-full' && classArray.some(cls => cls.startsWith('md:w-'))) return;

                                if (c.startsWith('md:')) {
                                    newClasses.push(c.substring(3));
                                } else {
                                    newClasses.push(c);
                                }
                            });
                            el.className = newClasses.join(' ');
                        }
                    });

                    // 5. บังคับโครงสร้างตารางด้วย CSS และ Colgroup
                    const styleFix = document.createElement('style');
                    styleFix.innerHTML = `
                        table { table-layout: fixed !important; width: 100% !important; max-width: 100% !important; border-collapse: collapse !important; }
                        td, th { word-wrap: break-word !important; overflow-wrap: break-word !important; white-space: normal !important; box-sizing: border-box !important; }
                        td > div { max-width: 100% !important; }
                        tbody tr td[colspan="6"] { width: 100% !important; } /* แถวหัวข้อใหญ่ */
                    `;
                    clone.insertBefore(styleFix, clone.firstChild);

                    // สร้างกระดูกสันหลังล็อคความกว้างให้แต่ละคอลัมน์ โดยแยกประเภทตาราง
                    clone.querySelectorAll('table').forEach(table => {
                        const isSummaryTable = table.closest('#section-summary') !== null;
                        const colgroup = document.createElement('colgroup');

                        if (isSummaryTable) {
                            // ตารางสรุปผล มี 5 คอลัมน์
                            colgroup.innerHTML = `

                            `;
                        } else {
                            // ตารางเช็คลิสต์ปกติ มี 6 คอลัมน์
                            colgroup.innerHTML = `
                                <col style="width: 8%;" />
                                <col style="width: 44%;" />
                                <col style="width: 8%;" />
                                <col style="width: 12%;" />
                                <col style="width: 18%;" />
                                <col style="width: 10%;" />
                            `;
                        }
                        table.insertBefore(colgroup, table.firstChild);
                    });

                    wrapper.appendChild(clone);
                    document.body.appendChild(wrapper);

                    window.scrollTo(0, 0);
                    await new Promise(r => setTimeout(r, 500));

                    // 6. ระบบแบ่งหน้าอัจฉริยะ (Smart Page Break)
                    const A4_RATIO = 297 / 210;
                    const pageHeightPx = Math.floor(1024 * A4_RATIO);

                    const rows = clone.querySelectorAll('tr, .page-break-inside-avoid, #section-info, #section-summary, #section-signature');

                    for (let i = 0; i < rows.length; i++) {
                        const el = rows[i];
                        if (window.getComputedStyle(el).display === 'none') continue;

                        const wRect = wrapper.getBoundingClientRect();
                        const rect = el.getBoundingClientRect();

                        const elTop = rect.top - wRect.top;
                        const elHeight = rect.height;

                        if (elHeight === 0) continue;

                        const startPage = Math.floor(elTop / pageHeightPx);
                        const endPage = Math.floor((elTop + elHeight) / pageHeightPx);

                        if (startPage !== endPage && elHeight < pageHeightPx) {
                            const pushAmount = ((startPage + 1) * pageHeightPx) - elTop;

                            if (el.tagName === 'TR') {
                                const spacer = document.createElement('tr');
                                spacer.style.height = `${pushAmount}px`;
                                spacer.innerHTML = `<td colspan="6" style="border:none; padding:0; height:${pushAmount}px;"></td>`;
                                el.parentNode.insertBefore(spacer, el);
                            } else {
                                el.style.marginTop = `${parseFloat(window.getComputedStyle(el).marginTop || 0) + pushAmount}px`;
                            }
                        }
                    }

                    // 7. ถ่ายภาพรวดเดียวจบ (ตั้งสเกล 1.5 เพื่อความคมชัดแบบพอดี ไม่กินแรม)
                    const canvas = await html2canvas(wrapper, {
                        scale: 1.5,
                        useCORS: true,
                        backgroundColor: '#ffffff',
                        width: 1024,
                        windowWidth: 1024,
                        scrollY: 0,
                        logging: false
                    });

                    // 8. จัดลงไฟล์ PDF ทีละแผ่น
                    const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();

                    const imgHeightInMM = (canvas.height * pdfWidth) / canvas.width;
                    let heightLeft = imgHeightInMM;
                    let position = 0;

                    const imgData = canvas.toDataURL('image/jpeg', 0.85);

                    pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeightInMM);
                    heightLeft -= pdfHeight;

                    while (heightLeft > 1) {
                        position = heightLeft - imgHeightInMM;
                        pdf.addPage();
                        pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeightInMM);
                        heightLeft -= pdfHeight;
                    }

                    return pdf.output('blob');

                } catch (error) {
                    console.error("PDF generation failed:", error);
                    throw error;
                } finally {
                    // ล้างหน้าจอ 100% ป้องกันหน้าค้าง
                    if (wrapper && document.body.contains(wrapper)) document.body.removeChild(wrapper);
                    if (overlay && document.body.contains(overlay)) document.body.removeChild(overlay);
                }
            };

            const exportToPDF = async () => {
                const btn = document.getElementById('pdf-btn');
                if(!btn) return;
                const originalText = btn.innerHTML;
                btn.innerHTML = 'กำลังประมวลผล PDF...'; btn.disabled = true;

                try {
                    const filename = `QA_${storeInfo.code || 'Store'}_${storeInfo.date || 'Date'}.pdf`;
                    const blob = await processPDF(filename);
                    if (blob) {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url; a.download = filename;
                        document.body.appendChild(a); a.click(); document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }
                } catch (err) {
                    console.error("PDF generation error", err);
                    setModalInfo({ show: true, message: `เกิดข้อผิดพลาดในการสร้าง PDF:\n${err.message}`, isError: true });
                } finally {
                    btn.innerHTML = originalText; btn.disabled = false;
                }
            };

            const downloadFilteredDataAsZip = async () => {
                if (typeof JSZip === 'undefined' || typeof html2canvas === 'undefined' || typeof jspdf === 'undefined') {
                    setModalInfo({ show: true, message: 'ไม่พบไลบรารีที่จำเป็น กรุณารีเฟรชหน้าต่าง', isError: true });
                    return;
                }

            const SearchableSelect = ({ value, onChange, options, placeholder }) => {
                const [isOpen, setIsOpen] = React.useState(false);
                const [inputValue, setInputValue] = React.useState('');
                const wrapperRef = React.useRef(null);

                React.useEffect(() => {
                    const selectedOption = options.find(opt => opt.value === value);
                    if (selectedOption) {
                        setInputValue(selectedOption.label);
                    } else {
                        setInputValue('');
                    }
                }, [value, options]);

                React.useEffect(() => {
                    function handleClickOutside(event) {
                        if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
                            setIsOpen(false);
                            const selectedOption = options.find(opt => opt.value === value);
                            setInputValue(selectedOption ? selectedOption.label : '');
                        }
                    }
                    document.addEventListener("mousedown", handleClickOutside);
                    return () => document.removeEventListener("mousedown", handleClickOutside);
                }, [wrapperRef, value, options]);

                const filteredOptions = options.filter(opt =>
                    opt.label.toLowerCase().includes(inputValue.toLowerCase()) ||
                    opt.value.toLowerCase().includes(inputValue.toLowerCase())
                );

                return (
                    <div ref={wrapperRef} className="relative w-full">
                        <div className="relative">

                                type="text"
                                className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:border-yellow-400 focus:outline-none bg-white shadow-sm pr-8"
                                placeholder={placeholder}
                                value={inputValue}
                                onClick={() => setIsOpen(true)}
                                onChange={(e) => {
                                    setInputValue(e.target.value);
                                    setIsOpen(true);

                            <div className="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none text-gray-400">

                                    className="absolute inset-y-0 right-6 flex items-center px-1 text-gray-400 hover:text-red-500"

            const formatMonthYear = (yyyy_mm) => {
                if (!yyyy_mm || !yyyy_mm.includes('-')) return yyyy_mm;
                const [year, month] = yyyy_mm.split('-');
                const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
                return `${thaiMonths[parseInt(month, 10) - 1]} ${parseInt(year, 10) + 543}`;
            };

            const dashboardData = React.useMemo(() => {

                const availableMonths = [...new Set([...lastNMonths(12), ...auditHistory.map(r => r.month)])].filter(Boolean).sort().reverse();

                    if (code) {
                        if (filterMonth === '') {
                            if (!auditMap[code]) auditMap[code] = record;

                        auditRecord: auditMap[store.code] || null,
                        isAudited: !!auditMap[store.code]
                    };
                });

                const storeCodes = new Set(storeDataList.map(s => s.code));
                Object.keys(auditMap).forEach(code => {
                    if (!storeCodes.has(code)) {
                        const record = auditMap[code];
                        allStores.push({
                            code: code,
                            name: record.storeInfo?.name || 'ไม่ทราบชื่อ',
                            province: record.storeInfo?.province || '',
                            department: record.storeInfo?.department || '',
                            zone: record.storeInfo?.zone || '',
                            auditor: record.storeInfo?.auditor || '',
                            auditRecord: record,
                            isAudited: true
                        });
                    }
                });

                const getDeptWeight = (dept) => {
                    if (!dept) return 99;
                    const d = String(dept);
                    if (d.includes('ฝอต')) return 1;
                    if (d.includes('ฝอน')) return 2;
                    if (d.includes('ฝอฉ')) return 3;
                    if (d.includes('ฝออ')) return 4;
                    return 99;
                };

                const getDeptNumber = (dept) => {
                    if (!dept) return 999;
                    const match = String(dept).match(/\d+/);
                    return match ? parseInt(match[0], 10) : 999;
                };

                const depts = [...new Set(allStores.map(r => r.department).filter(Boolean))].sort((a, b) => {
                    const wA = getDeptWeight(a); const wB = getDeptWeight(b);
                    if (wA !== wB) return wA - wB;
                    const numA = getDeptNumber(a); const numB = getDeptNumber(b);
                    if (numA !== numB) return numA - numB;
                    return a.localeCompare(b);
                });

                const availableRegions = [...new Set(allStores
                    .filter(s => filterDept === '' || s.department === filterDept)
                    .map(r => r.zone)
                    .filter(Boolean)
                )].sort();

                const availableStoresForDropdown = allStores
                    .filter(s => filterDept === '' || s.department === filterDept)
                    .filter(s => filterRegion === '' || s.zone === filterRegion)
                    .sort((a, b) => (a.code || '').localeCompare(b.code || ''));

                const filteredStores = allStores.filter(store => {

                    const regionMatch = filterRegion === '' || store.zone === filterRegion;

                    let statusMatch = true;

                    if (filterStatus === 'pending') statusMatch = !store.isAudited;

                    let scoreMatch = true;

                        if (!store.isAudited) scoreMatch = false;

                            if (filterScore === 'lt90') scoreMatch = score < 90;
                        }
                    }
                    return searchMatch && deptMatch && regionMatch && statusMatch && scoreMatch;
                });

                filteredStores.sort((a, b) => {
                    const weightA = getDeptWeight(a.department); const weightB = getDeptWeight(b.department);
                    if (weightA !== weightB) return weightA - weightB;
                    const numA = getDeptNumber(a.department); const numB = getDeptNumber(b.department);
                    if (numA !== numB) return numA - numB;
                    if (!a.isAudited && b.isAudited) return -1;
                    if (a.isAudited && !b.isAudited) return 1;
                    return (a.code || '').localeCompare(b.code || '');
